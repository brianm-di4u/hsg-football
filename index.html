      const m = Math.hypot(inp.sx, inp.sy);
      a.wp = a.route ? a.route.length : 0; // the player took over: drop the designed path
      return [(inp.sx / m) * sp, (inp.sy / m) * sp];
    }
    if (a.role === 'carrierPath' && a.route && a.wp < a.route.length && a.y * (a.side === 'O' ? 1 : -1) < 0.3) {
      v = followPath(a, sp);
      if (v) return v;
    }
    return carrierAuto(P, a);
  }

  if (a.side === 'O' || P.intRet) {
    const friendly = c.side === a.side;
    switch (friendly ? a.role : 'pursue') {
      case 'qbPass': {
        if (pd.fake && t < 0.6) return seekVel(a, bx + pd.mesh[0], pd.mesh[1], sp * 0.8, 1);
        if (P.thrown) return [0, 0];
        if (P.userSide === 'O' && inp && Math.hypot(inp.sx, inp.sy) > 0.15) {
          const m = Math.hypot(inp.sx, inp.sy);
          return [(inp.sx / m) * sp * 0.75, (inp.sy / m) * sp * 0.75];
        }
        return seekVel(a, bx, pd.drop || -6.5, sp * 0.8, 1.5);
      }
      case 'qbHand': {
        if (pd.qbDrop && t < pd.delay) return seekVel(a, bx, pd.qbDrop, sp * 0.8, 1.2);
        if (!P.handed) return seekVel(a, bx + pd.mesh[0] * 0.4, pd.mesh[1] + 0.8, sp * 0.6, 1);
        return seekVel(a, a.x - 1.5, a.y - 2, sp * 0.4, 1);
      }
      case 'qbKeep': {
        if (t < pd.meshT) return seekVel(a, bx + pd.mesh[0] * 0.4, pd.mesh[1] + 0.6, sp * 0.6, 1);
        return seekVel(a, bx + pd.hole[0], pd.hole[1] + 3, sp);
      }
      case 'carrierPath': {
        if (!a.route) a.route = pd.path ? pd.path.map(([dx, y]) => [clampX(bx + dx), y]) : [[bx + pd.mesh[0], pd.mesh[1]], [clampX(bx + pd.hole[0]), pd.hole[1]], [clampX(bx + pd.hole[0] * 1.15), pd.hole[1] + 4]];
        if (pd.delay && t < pd.delay) return [0, 0];
        return followPath(a, sp * (P.handed ? 1 : 0.85)) || [0, sp];
      }
      case 'rbFake': {
        const tEnd = pd.fake && pd.type === 'pass' ? 0.75 : 0.9;
        if (t < tEnd) return seekVel(a, bx + (pd.mesh ? pd.mesh[0] : 0) + 0.8, (pd.mesh ? pd.mesh[1] : -3) + 2.5, sp * 0.9);
        a.role = pd.type === 'pass' ? 'passPro' : 'lead';
        return [0, 0];
      }
      case 'route': {
        const b = P.ball;
        if (b.st === 'air' && b.to === a.i && b.T - b.t < 1.1) return seekVel(a, b.tx, b.ty, sp);
        if (P.ball.st === 'held' && c !== qb && c.side === a.side) { a.role = 'lead'; return [0, 0]; }
        if (pd.type === 'run' && P.handed) { a.role = 'lead'; return [0, 0]; }
        const fv = followPath(a, sp);
        if (fv) return fv;
        if (a.settle) return [0, 0];
        const last = a.route[a.route.length - 1], prev = a.route.length > 1 ? a.route[a.route.length - 2] : [a.x0, a.y0];
        const dx = last[0] - prev[0], dy = last[1] - prev[1], m = Math.hypot(dx, dy) || 1;
        return [(dx / m) * sp * 0.85, (dy / m) * sp * 0.85];
      }
      case 'stalk': {
        const fv = followPath(a, sp * 0.7);
        if (fv && t < 1.2) return fv;
        a.role = 'lead';
        return [0, 0];
      }
      case 'pull': {
        if (t < 0.9 && !P.handed) return seekVel(a, bx + 9, -1.6, sp);
        a.role = 'lead';
        return [0, 0];
      }
      case 'passPro': {
        const prot = c;
        if (!(t % 0.2 < TICK) && a.tgt >= 0 && A[a.tgt].eng < 0) { /* keep target */ } else {
          a.tgt = nearestThreat(P, a, prot, a.side, (d) => d.eng < 0 && (d.role === 'rush' || d.pursueAt >= 0 && t >= d.pursueAt) && Math.abs(d.x - a.x) < 6);
        }
        if (a.tgt >= 0) {
          const d = A[a.tgt];
          const ux = prot.x - d.x, uy = prot.y - d.y, m = Math.hypot(ux, uy) || 1;
          return seekVel(a, d.x + (ux / m) * 0.9, d.y + (uy / m) * 0.9, sp);
        }
        return seekVel(a, a.x0 + (prot.x - a.x0) * 0.2, Math.min(a.y0, -1.2), sp * 0.5, 1);
      }
      case 'runBlock': {
        if (a.tgt < 0 || A[a.tgt].eng >= 0 && A[a.tgt].eng !== a.i || t % 0.25 < TICK) {
          a.tgt = nearestThreat(P, a, a, a.side, (d) => (d.eng < 0 || d.eng === a.i) && d.y > a.y - 1.5 && Math.abs(d.x - a.x) < 5 && d.y - a.y < 7);
        }
        if (a.tgt >= 0) {
          const d = A[a.tgt];
          const ux = c.x - d.x, uy = c.y - d.y, m = Math.hypot(ux, uy) || 1;
          return seekVel(a, d.x + (ux / m) * 0.9, d.y + (uy / m) * 0.9, sp);
        }
        return seekVel(a, a.x, a.y + 2, sp * 0.5);
      }
      case 'lead': {
        const f = c.side === 'O' ? 1 : -1;
        if (a.tgt < 0 || A[a.tgt].eng >= 0 || t % 0.25 < TICK) {
          a.tgt = nearestThreat(P, a, c, a.side, (d) => d.eng < 0 && (d.y - c.y) * f > -1 && dist(d, c) < 10);
        }
        if (a.tgt >= 0) {
          const d = A[a.tgt];
          const ux = c.x - d.x, uy = c.y - d.y, m = Math.hypot(ux, uy) || 1;
          return seekVel(a, d.x + (ux / m) * 0.9, d.y + (uy / m) * 0.9, sp * 0.95);
        }
        return seekVel(a, c.x + (a.x - c.x) * 0.5, c.y + 3 * f, sp * 0.8);
      }
      case 'pursue':
      default: {
        if (c.side === a.side) return [0, 0];
        const [px, py] = predictPos(a, c, sp);
        return seekVel(a, px, py, sp);
      }
    }
  }

  // Defense
  const b = P.ball;
  if (P.caught || P.handed && pd.type === 'run' || P.scramble || pd.carrier === 'QB' && P.handed) {
    if (a.pursueAt >= 0 && t >= a.pursueAt) a.role = 'pursue';
  }
  if (b.st === 'air' && a.ballAt >= 0 && t >= a.ballAt && a.role !== 'rush') return seekVel(a, b.tx, b.ty, sp);
  switch (a.role) {
    case 'rush': {
      const [px, py] = predictPos(a, c, sp, 1.6, 0.6);
      a.gx = px; a.gy = py;
      return seekVel(a, px, py, sp);
    }
    case 'pursue': {
      const [px, py] = predictPos(a, c, sp);
      a.gx = px; a.gy = py;
      return seekVel(a, px, py, sp);
    }
    case 'spy': {
      if (qb.y > 0.3 && P.carrier === qb.i) { a.role = 'pursue'; return [0, 0]; }
      a.gx = qb.x; a.gy = qb.y + 5.5;
      return seekVel(a, qb.x, Math.max(qb.y + 5.5, 3), sp * 0.9, 1.5);
    }
    case 'fit': {
      if (pd.fake && t < 0.7) {
        if (a.bite === false && t < TICK * 1.5) a.bite = rng.chance(0.75 - a.r.awr * 0.005);
        if (a.bite) return seekVel(a, a.x0 + (bx - a.x0) * 0.3, 1.5, sp * 0.7);
      }
      if (t > 0.75 && pd.type === 'pass' && !P.scramble) {
        a.role = 'zone'; a.assign = a.x0 < bx - 2 ? 'hookL' : a.x0 > bx + 2 ? 'hookR' : 'hookM';
        return [0, 0];
      }
      const cx = (c ? c.x : bx);
      a.gx = a.x0 + (cx - a.x0) * 0.6; a.gy = Math.max(1.2, a.y0 - t * 1.5);
      return seekVel(a, a.gx, a.gy, sp * 0.6, 1);
    }
    case 'man': {
      const m = A[P.idx[a.assign]];
      if (!m || m.role !== 'route') {
        a.gx = m ? m.x : bx; a.gy = 4;
        return seekVel(a, a.gx, a.gy, sp * 0.6, 1.5);
      }
      const lag = clamp(0.32 - a.r.cov * 0.0025, 0.07, 0.25);
      if (a.nextLook === undefined || t >= a.nextLook) {
        const cushion = Math.max(0.6, (a.y0 - m.y0) - t * 2.2);
        a.gx = m.x + m.vx * 0.3; a.gy = m.y + m.vy * 0.3 + cushion;
        a.nextLook = t + lag;
      }
      if (pd.fake && t < 0.6 && rng.chance(0.01)) a.nextLook += 0.2;
      return seekVel(a, a.gx, a.gy, sp);
    }
    case 'zone': {
      const z = ZONES[a.assign] || ZONES.hookM;
      const deep = z[1] >= 12;
      const lx = clampX(bx + z[0]), ly = Math.min(z[1], P.toGoal + (deep ? 6 : 3));
      if (pd.fake && t < 0.6 && !deep) {
        if (t < TICK * 1.5) a.bite = rng.chance(0.7 - a.r.awr * 0.005);
        if (a.bite) return seekVel(a, a.x, 2, sp * 0.6);
      }
      let thr = null, score = -99;
      for (const s of SLOTS) {
        const r = A[P.idx[s]];
        if (r.role !== 'route') continue;
        const d = Math.hypot(r.x - lx, r.y - ly);
        if (d > z[2]) continue;
        const sc = deep ? r.y * 0.5 - d : -d;
        if (sc > score) { score = sc; thr = r; }
      }
      if (thr) {
        if (deep) { a.gx = lx + (thr.x - lx) * 0.8; a.gy = Math.max(ly, thr.y + 4 + Math.max(0, thr.vy) * 0.6); }
        else { a.gx = lx + (thr.x - lx) * 0.7; a.gy = ly + (thr.y - ly) * 0.7; }
        return seekVel(a, a.gx, a.gy, sp, 0.8);
      }
      a.gx = lx; a.gy = ly;
      return seekVel(a, lx, ly, sp * 0.9, 2);
    }
  }
  return [0, 0];
}

function endPlay(P, kind, extra = {}) {
  if (P.result) return;
  const c = P.A[P.carrier];
  const pd = playById(P.offId);
  let y = c.y;
  if (kind === 'tackle' || kind === 'sack' || kind === 'fumble') y += c.side === 'O' ? 0.5 : -0.5;
  let yards = 0;
  if (c.side === 'O' && !['inc', 'throwaway'].includes(kind)) yards = Math.round(clamp(y, -P.ballOn, P.toGoal));
  const res = {
    kind, yards, elapsed: Math.max(1, P.t), x: c.x, y,
    playType: pd.type, carrierSide: c.side, carrierPid: c.pid, carrierSlot: c.slot,
    thrown: P.thrown, caught: P.caught, airYards: P.airYards || 0,
    passerPid: P.thrown ? P.A[P.idx.QB].pid : null,
    targetPid: P.ball.to >= 0 ? P.A[P.ball.to].pid : null,
    ...extra,
  };
  res.clockStops = ['inc', 'oob', 'td', 'safety', 'int', 'throwaway', 'fumbleLost', 'touchback'].includes(kind) || !!extra.turnover;
  P.result = res;
  P.phase = 'dead';
  P.ev.push({ k: 'dead', kind });
}

function stepPlay(P, rng, inp) {
  if (P.phase !== 'live') return;
  const dt = TICK;
  P.t += dt;
  const A = P.A, qb = A[P.idx.QB], pd = playById(P.offId), b = P.ball;

  // Handoffs
  if (pd.type === 'run' && !P.handed && P.t >= pd.meshT) {
    if (pd.carrier === 'QB') {
      P.handed = true; P.runRec = P.t; setPursuit(P, 1.25);
      qb.role = 'carrierPath'; qb.wp = 0;
      qb.route = [[clampX(P.bx + pd.hole[0]), pd.hole[1]], [clampX(P.bx + pd.hole[0] * 1.15), pd.hole[1] + 4]];
      P.ev.push({ k: 'keep' });
    } else {
      const rb = A[P.idx.RB];
      if (dist(rb, qb) < (pd.id === 'sweep' ? 3.5 : 2.2) || P.t > pd.meshT + 0.7) {
        P.handed = true; P.carrier = rb.i; b.h = rb.i; P.runRec = P.t; setPursuit(P);
        P.ev.push({ k: 'handoff' });
      }
    }
  }

  // QB decisions
  if (pd.type === 'pass' && !P.thrown && P.carrier === qb.i) {
    if (!P.scramble && qb.y > 0.5) { P.scramble = true; setPursuit(P, 1); P.ev.push({ k: 'scramble' }); }
    if (inp && inp.throwSlot && P.userSide === 'O') throwTo(P, rng, inp.throwSlot);
    else if (canThrow(P) && (P.userSide !== 'O' || P.autoQB)) autoRead(P, rng, qb, pd);
  }

  // Screens: the line lets its rushers go and releases downfield to lead.
  if (pd.screen && !P.released && P.t >= 0.85) {
    P.released = true;
    for (const s of OL) {
      const o = A[P.idx[s]];
      if (o.eng >= 0) { A[o.eng].eng = -1; o.eng = -1; }
      o.role = 'lead'; o.tgt = -1; o.beaten = 0.25;
    }
  }

  // Juke
  const c = A[P.carrier];
  if (b.st === 'held' && (c.slot !== 'QB' || P.scramble || P.handed || P.intRet)) {
    const user = P.userSide && P.userSide === c.side;
    let want = user && inp && inp.juke;
    if (!user && c.jukeCD <= 0) {
      for (const a of A) {
        if (a.side === c.side || a.eng >= 0) continue;
        if (dist(a, c) < 1.7 && rng.chance(c.r.agi / 250 * dt * 6)) { want = true; break; }
      }
    }
    if (want && c.jukeCD <= 0) {
      let near = null, nd = 99;
      for (const a of A) if (a.side !== c.side) { const d = dist(a, c); if (d < nd) { nd = d; near = a; } }
      const side = near && Math.abs(c.x - near.x) > 0.05 ? Math.sign(c.x - near.x) : 1;
      c.vx += side * 2.6; c.jukeT = 0.45; c.jukeCD = 1.4;
      P.ev.push({ k: 'juke', i: c.i });
    }
  }

  // Desired velocities
  for (const a of A) {
    if (a.eng >= 0) continue;
    const v = think(P, a, rng, inp) || [0, 0];
    a.dvx = v[0]; a.dvy = v[1];
  }
  for (const a of A) {
    if (a.eng >= 0) continue;
    let mult = 1;
    if (a.i === P.carrier && b.st === 'held' && (a.slot !== 'QB' || P.scramble || P.handed)) mult *= 0.94;
    else if (a.role === 'pursue' && dist(a, A[P.carrier]) < 5) mult *= 1.06;
    if (a.slow > 0) mult *= 0.4;
    if (a.beaten > 0) mult *= 0.6;
    integrate(a, a.dvx, a.dvy, dt, a.maxV * mult, a.acc * (a.jukeT > 0 ? 1.6 : 1));
  }

  // Engagements: blockers latch onto their target.
  for (const a of A) {
    if (!BLOCK_ROLES.has(a.role) || a.eng >= 0 || a.beaten > 0 || a.tgt < 0) continue;
    if (a.side !== A[P.carrier].side) continue;
    const d = A[a.tgt];
    if (d.eng < 0 && d.i !== P.carrier && d.side !== a.side && dist(a, d) < 1.15) { a.eng = d.i; d.eng = a.i; }
  }
  for (const bl of A) {
    if (bl.eng < 0 || !BLOCK_ROLES.has(bl.role)) continue;
    const d = A[bl.eng];
    const cc = A[P.carrier];
    let gx = d.gx, gy = d.gy;
    if (!gx && !gy || d.role === 'rush' || d.role === 'pursue') { gx = cc.x; gy = cc.y; }
    const ux = gx - d.x, uy = gy - d.y, m = Math.hypot(ux, uy) || 1;
    const drive = bl.role === 'runBlock' ? 1.42 : 1.3;
    const net = (d.r.str + d.r.agi * 0.3) - bl.r.blk * drive;
    const vp = clamp(0.4 + net * 0.03, -0.8, 1.6);
    d.vx = (ux / m) * vp; d.vy = (uy / m) * vp;
    d.x += d.vx * dt; d.y += d.vy * dt;
    bl.vx = d.vx; bl.vy = d.vy;
    bl.x = d.x + (ux / m) * 0.95; bl.y = d.y + (uy / m) * 0.95;
    let h = clamp(0.3 + ((d.r.str + d.r.agi) / 2 + 7 - bl.r.blk) / 110, 0.05, 0.9);
    if (bl.role === 'lead') h *= 1.6;
    else if (bl.role === 'runBlock') h *= 0.75;
    if (dist(d, cc) < 1.6 && cc.i !== P.idx.QB) h *= 2.5;
    if (rng.next() < h * dt) {
      d.eng = -1; bl.eng = -1; bl.beaten = 0.9; bl.tgt = -1;
      P.ev.push({ k: 'shed', i: d.i });
    }
  }

  // Ball
  if (b.st === 'held') { const h = A[b.h]; b.x = h.x; b.y = h.y; b.z = 0; }
  else if (b.st === 'air') {
    b.t += dt;
    const u = Math.min(1, b.t / b.T);
    b.x = b.fx + (b.tx - b.fx) * u; b.y = b.fy + (b.ty - b.fy) * u; b.z = 4 * b.hgt * u * (1 - u);
    if (u >= 1) resolveCatch(P, rng);
    if (P.result) return;
  }

  // Timers
  for (const a of A) {
    if (a.cd > 0) a.cd -= dt;
    if (a.slow > 0) a.slow -= dt;
    if (a.beaten > 0) a.beaten -= dt;
    if (a.jukeT > 0) a.jukeT -= dt;
    if (a.jukeCD > 0) a.jukeCD -= dt;
  }

  // Tackles, boundaries, scores
  if (b.st === 'held') {
    const cc = A[P.carrier];
    const f = cc.side === 'O' ? 1 : -1;
    if (cc.side === 'O' && cc.y >= P.toGoal) return endPlay(P, 'td', { scorer: 'O' });
    if (cc.side === 'D' && cc.y <= -P.ballOn) return endPlay(P, 'td', { scorer: 'D', turnover: true, intReturn: true });
    if (cc.x < 0.3 || cc.x > W - 0.3) return endWhere(P, 'oob');
    const near = [];
    for (const a of A) if (a.side !== cc.side && dist(a, cc) < 1.5) near.push(a);
    const immune = pd.type === 'run' && !P.handed && pd.carrier !== 'QB';
    for (const a of near) {
      if (a.cd > 0 || immune) continue;
      const d = dist(a, cc);
      const behind0 = (a.y - cc.y) * f < 0;
      if (d >= (behind0 ? 1.35 : 0.95)) continue; // trailing chasers can dive from a little farther
      let p = (d >= 0.95 ? 0.6 : 1) * 0.55 + (a.r.tkl - (cc.r.str + cc.r.agi) / 2) / 200 + 0.14 * (near.length - 1);
      if (cc.jukeT > 0) p -= 0.35;
      if (a.eng >= 0) p *= 0.35;
      const behind = (a.y - cc.y) * f < 0;
      if (behind && Math.hypot(cc.vx, cc.vy) > cc.maxV * 0.85) p -= 0.08;
      if (cc.slot === 'QB' && !P.thrown && !P.scramble && pd.type === 'pass') p += 0.12;
      p = clamp(p, d >= 0.95 ? 0.1 : 0.15, 0.95);
      a.cd = 0.7;
      if (rng.next() < p) {
        const fumP = 0.012 + (near.length > 1 ? 0.01 : 0);
        const sack = cc.slot === 'QB' && pd.type === 'pass' && !P.thrown && cc.y < 0 && !P.scramble;
        if (rng.next() < fumP && !P.intRet) {
          const lost = rng.next() >= 0.55;
          return endWhere(P, lost ? 'fumbleLost' : 'tackle', { tacklerPid: a.pid, fumble: true, turnover: lost, sack });
        }
        return endWhere(P, sack ? 'sack' : 'tackle', { tacklerPid: a.pid });
      }
      a.slow = d >= 0.95 ? 0.3 : 0.6;
      P.ev.push({ k: 'miss', i: a.i });
    }
  }

  // Keep players from stacking on top of each other.
  for (let i = 0; i < A.length; i++) {
    const p = A[i];
    for (let j = i + 1; j < A.length; j++) {
      const q = A[j];
      if (p.eng === j || (i === P.carrier || j === P.carrier) && p.side !== q.side) continue;
      const dx = q.x - p.x, dy = q.y - p.y, d2 = dx * dx + dy * dy;
      if (d2 > 0.81 || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), push = (0.9 - d) * 0.25;
      p.x -= (dx / d) * push; p.y -= (dy / d) * push; q.x += (dx / d) * push; q.y += (dy / d) * push;
    }
  }

  if (P.t >= MAX_T) endWhere(P, 'tackle', { capped: true });
}

function endWhere(P, kind, extra = {}) {
  const c = P.A[P.carrier];
  // Safety: an offensive carrier downed in their own end zone. Touchback: an interception downed in the end zone.
  if (c.side === 'O' && c.y + (kind === 'oob' ? 0 : 0.5) <= -P.ballOn && kind !== 'fumbleLost') return endPlay(P, 'safety', extra);
  if (c.side === 'D' && c.y >= P.toGoal) return endPlay(P, 'touchback', { ...extra, intReturn: true, turnover: true });
  if (P.intRet) return endPlay(P, 'int', { ...extra, intReturn: true, turnover: true, intSpot: P.toGoal - c.y + (kind === 'oob' ? 0 : 0.5) });
  endPlay(P, kind, extra);
}

function resolveCatch(P, rng) {
  const A = P.A, b = P.ball, qb = A[P.idx.QB];
  if (b.away) return endPlay(P, 'throwaway', { incomplete: true });
  if (b.tx < 0 || b.tx > W || b.ty > P.toGoal + 10) return endPlay(P, 'inc', { incomplete: true, why: 'out' });
  const r = A[b.to];
  const dR = Math.hypot(r.x - b.tx, r.y - b.ty);

    const yards = house ? 100 : Math.max(0, Math.round(rng.normal(19 + (ret.r.spd - 60) * 0.25, 8)));
    const start = Math.round(100 - land);
    res = { touchback: false, land, start, ret: yards, ballOn: clamp(start + yards, 1, 100), td: start + yards >= 100, returner: ret.id };
  }
  g.kickAnim = { kind: free ? 'free' : 'kickoff', kicking, from: fromBallOn, ...res, t: 0 };
  g.phase = 'kickoff';
  g.play = null;
  return res;
}

function finishKickoff(g, rng) {
  const a = g.kickAnim;
  const recv = 1 - a.kicking;
  g.kickAnim = null;
  g.poss = recv; g.absX = W / 2;
  if (!g.ot && g.quarter <= 4) g.clock = Math.max(0, g.clock - 5);
  const rn = a.returner ? nameOf(g, recv, a.returner) : '';
  if (a.td) {
    logLine(g, `${tdef(g, recv).short}: ${rn} returns the kick for a touchdown!`);
    return scoreTD(g, recv, { text: 'TOUCHDOWN!', sub: `Kick return by ${rn}`, kind: 'td' });
  }
  g.ballOn = a.ballOn; g.down = 1; g.toGo = 10; g.drive = { start: g.ballOn, plays: 0 };
  const text = a.touchback ? 'Touchback' : `${rn} returns it ${a.ret} yd`;
  logLine(g, `${a.kind === 'free' ? 'Free kick' : 'Kickoff'}: ${text}. Ball on the ${yardLine(g.ballOn)}.`);
  setResult(g, { text: a.touchback ? 'TOUCHBACK' : `RETURN ${a.ret} YD`, sub: `${tdef(g, recv).short} ball on the ${yardLine(g.ballOn)}`, kind: 'kick' }, checkClockAfter(g));
}

function yardLine(b) {
  const v = Math.round(b);
  if (v === 50) return '50';
  return v < 50 ? `own ${v}` : `opp ${100 - v}`;
}

function punt(g, rng) {
  const side = g.poss, kt = st(g, side);
  const net = 33 + kt.K.r.kck * 0.12 + rng.normal(0, 5);
  const land = g.ballOn + net;
  const other = 1 - side;
  let ballOn, text;
  if (land >= 100) { ballOn = 20; text = 'Touchback'; }
  else { const ret = Math.max(0, Math.round(rng.normal(5, 5))); ballOn = clamp(Math.round(100 - land) + ret, 1, 99); text = ret > 0 ? `returned ${ret} yd` : 'downed'; }
  if (!g.ot) g.clock = Math.max(0, g.clock - 6);
  g.kickAnim = { kind: 'punt', kicking: side, from: g.ballOn, land: Math.min(land, 105), ballOn, t: 0, touchback: land >= 100 };
  logLine(g, `${tdef(g, side).short} punts ${Math.round(net)} yd, ${text}.`);
  g.stats.team[side].plays++;
  g.phase = 'kickoff';
  g.pendingPunt = { other, ballOn, text };
}

function finishPunt(g) {
  const p = g.pendingPunt;
  g.pendingPunt = null; g.kickAnim = null;
  changePossession(g, p.other, p.ballOn);
  setResult(g, { text: 'PUNT', sub: `${p.text[0].toUpperCase()}${p.text.slice(1)}: ${tdef(g, p.other).short} ball on the ${yardLine(p.ballOn)}`, kind: 'kick' }, checkClockAfter(g));
}

function changePossession(g, side, ballOn) {
  g.poss = side; g.ballOn = ballOn; g.down = 1; g.toGo = Math.min(10, 100 - ballOn); g.absX = W / 2;
  g.drive = { start: ballOn, plays: 0 };
}

// ---- Field goals and tries -------------------------------------------------------------------

function startKick(g, kind) {
  const side = g.poss;
  const dist = kind === 'pat' ? 20 : fgDistance(g.ballOn);
  g.kick = { kind, side, dist, kck: st(g, side).K.r.kck, t: 0, user: g.user === side };
  g.phase = 'kick';
}

function aiKickError(rng, kck) { return clamp(rng.normal(0, 0.26 - kck * 0.0012), -1, 1); }

function resolveKick(g, e, rng) {
  const k = g.kick;
  if (!k) return null;
  const tol = kickTolerance(k.kck, k.dist), range = kickRange(k.kck);
  const good = Math.abs(e) <= tol && k.dist <= range;
  const why = good ? '' : k.dist > range ? 'short' : e < 0 ? 'wide left' : 'wide right';
  const kp = st(g, k.side).K, ps = pstat(g, k.side, kp);
  g.kickAnim = { kind: k.kind, side: k.side, good, e, dist: k.dist, why, t: 0, ballOn: g.ballOn };
  g.kick = null;
  g.phase = 'kickfly';
  if (k.kind === 'pat') {
    ps.xpa++; if (good) ps.xp++;
    g.pendingKick = { kind: 'pat', good, side: k.side };
  } else {
    ps.fga++; if (good) ps.fg++;
    if (!g.ot) g.clock = Math.max(0, g.clock - 5);
    g.stats.team[k.side].plays++;
    g.pendingKick = { kind: 'fg', good, side: k.side, dist: k.dist, why };
  }
  return { good, why, tol };
}

function finishKick(g, rng) {
  const p = g.pendingKick;
  g.pendingKick = null; g.kickAnim = null;
  if (p.kind === 'pat') {
    if (p.good) addScore(g, p.side, 1);
    logLine(g, `Kick try ${p.good ? 'is good' : 'is no good'}.`);
    setResult(g, { text: p.good ? 'TRY IS GOOD' : 'NO GOOD', sub: p.good ? '+1' : 'The kick misses', kind: p.good ? 'score' : 'miss' }, afterScoreNext(g, p.side));
    return;
  }
  if (p.good) {
    addScore(g, p.side, 3);
    logLine(g, `${tdef(g, p.side).short} ${p.dist}-yd field goal is good.`);
    setResult(g, { text: 'FIELD GOAL!', sub: `${p.dist} yards: +3`, kind: 'score' }, afterScoreNext(g, p.side));
  } else {
    logLine(g, `${p.dist}-yd field goal ${p.why}.`);
    const other = 1 - p.side;
    if (g.ot) { setResult(g, { text: 'NO GOOD', sub: `${p.dist} yd, ${p.why}`, kind: 'miss' }, 'otNext'); return; }
    changePossession(g, other, Math.max(20, 100 - (g.ballOn - 7)));
    setResult(g, { text: 'NO GOOD', sub: `${p.dist} yd, ${p.why}. ${tdef(g, other).short} ball`, kind: 'miss' }, checkClockAfter(g));
  }
}

function addScore(g, side, n) {
  g.score[side] += n;
  const qi = Math.min(3, g.quarter - 1);
  if (g.quarter <= 4) g.qScores[side][qi] += n;
  else { g.qScores[side][4] = (g.qScores[side][4] || 0) + n; g.qScores[1 - side][4] = g.qScores[1 - side][4] || 0; }
}

function scoreTD(g, side, res) {
  addScore(g, side, 6);
  g.poss = side; g.tryFor = side;
  setResult(g, res, 'pat');
}

function afterScoreNext(g, side) {
  if (g.ot) return 'otNext';
  return checkClockAfter(g, { kickoffBy: side });
}

function chooseTry(g, kind) {
  if (g.phase !== 'pat') return false;
  const side = g.tryFor;
  g.poss = side;
  if (kind === 'kick') { g.ballOn = 97; startKick(g, 'pat'); }
  else { g.ballOn = 97; g.down = 1; g.toGo = 3; g.absX = W / 2; g.twoPoint = true; g.phase = 'call'; }
  return true;
}

// ---- Calling and running plays -----------------------------------------------------------------
function specialsFor(g) {
  const out = [];
  if (g.twoPoint) return out;
  if (g.down === 4 || g.ot && g.down >= 3) out.push('punt');
  const kck = st(g, g.poss).K.r.kck;
  if (fgDistance(g.ballOn) <= kickRange(kck) + 2 && g.ballOn >= 50) out.push('fg');
  if (canKneel(g)) out.push('kneel');
  if (g.ot) return out.filter((x) => x !== 'punt' && x !== 'kneel');
  return out;
}


function callPlay(g, offId, defId, rng, opts = {}) {
  if (g.phase !== 'call') return false;
  // Between-play runoff applies at the next snap (a timeout cancels it).
  if (g.runoff > 0 && !g.ot) {
    g.clock -= g.runoff; g.runoff = 0;
    if (g.clock <= 0) { g.clock = 0; return endOfQuarter(g, rng), false; }
  }
  g.offCall = offId; g.defCall = defId;
  if (offId === 'punt') { punt(g, rng); return true; }
  if (offId === 'fg') { startKick(g, 'fg'); return true; }
  if (offId === 'kneel') {
    g.play = null; g.stats.team[g.poss].plays++;
    const res = { kind: 'tackle', yards: -1, elapsed: 2, clockStops: false, kneel: true, playType: 'run', carrierSide: 'O' };
    return applyResult(g, res, rng), true;
  }
  const off = st(g, g.poss), def = st(g, 1 - g.poss);
  const boost = AI.boostFor(g);
  g.play = createPlay(off, def, offId, defId, { bx: localBx(g), ballOn: g.ballOn, down: g.down, toGo: g.toGo },
    { userSide: g.user === null ? null : g.user === g.poss ? 'O' : 'D', autoQB: opts.autoQB !== false, rng, boost });
  g.play.offTeam = g.poss;
  if (g.user !== null && g.poss === g.user) { g.tend = g.tend || { run: 0, pass: 0 }; g.tend[playById(offId).type === 'run' ? 'run' : 'pass']++; }
  g.phase = 'pre';
  return true;
}

function snapPlay(g) {
  if (g.phase !== 'pre' || !g.play) return false;
  snap(g.play);
  g.phase = 'live';
  return true;
}

function stepLive(g, rng, inp) {
  if (g.phase !== 'live' || !g.play) return;
  stepPlay(g.play, rng, inp);
  if (g.play.phase === 'dead') applyResult(g, g.play.result, rng);
}

function finishLive(g, rng, inp = null) {
  if (g.phase === 'pre') snapPlay(g);
  if (g.phase !== 'live') return;
  let n = 0;
  while (g.phase === 'live' && n++ < 60 * 20) stepLive(g, rng, inp);
}

function setResult(g, res, next) {
  g.lastResult = res;
  g.next = next;
  g.phase = 'result';
}

function applyResult(g, r, rng) {
  const side = g.poss, other = 1 - side;
  const T = g.stats.team[side];
  const pd = playById(g.offCall) || {};
  g.plays++; g.drive.plays++;
  T.plays++;
  if (!g.ot) {
    g.clock -= r.elapsed;
    if (g.clock < 0) g.clock = 0;
    g.runoff = r.clockStops ? 0 : RUNOFF;
  }
  const off = g.teams[side], D = g.teams[other];
  const cname = r.carrierPid ? nameOf(g, r.carrierSide === 'O' ? side : other, r.carrierPid) : '';
  const qbP = st(g, side).QB;
  // Spot of the ball (absolute x), on the nearer hash when outside them.
  if (r.x !== undefined && !['inc', 'throwaway'].includes(r.kind)) {
    const ax = toAbsX(g, r.x);
    g.absX = clamp(ax, HASH[0], HASH[1]);
  }
  // Stats
  if (r.thrown && !r.throwaway) {
    const qs = pstat(g, side, qbP); qs.att++;
    if (r.caught || r.kind === 'td' && r.caught) { qs.cmp++; }
  }
  if (r.kind === 'throwaway') pstat(g, side, qbP).att++;
  const yards = r.yards || 0;
  const gain = r.carrierSide === 'O' && !r.intReturn ? yards : 0;
  if (r.carrierSide === 'O' && r.carrierPid && !['inc', 'throwaway'].includes(r.kind) && !r.kneel) {
    const cp = findP(g, side, r.carrierPid);
    if (r.caught) {
      const rs = pstat(g, side, cp); rs.rec++; rs.recy += gain;
      pstat(g, side, qbP).py += gain; T.py += gain;
    } else if (r.kind !== 'sack') {
      const rs = pstat(g, side, cp); rs.ru++; rs.ry += gain; T.ry += gain;
    }
    T.yds += gain;
  }
  if (r.kind === 'sack') { T.yds += gain; T.py += gain; }
  if (r.tacklerPid) {
    const tp = findP(g, other, r.tacklerPid);
    if (tp) { const ts = pstat(g, other, tp); ts.tkl++; if (r.kind === 'sack') ts.sk++; }
  }

  const tryPlay = !!g.twoPoint;
  if (tryPlay) {
    g.twoPoint = false;
    const ok = r.kind === 'td' && r.scorer === 'O';
    if (ok) addScore(g, side, 2);
    logLine(g, `Two-point try ${ok ? 'is good' : 'fails'}.`);
    return setResult(g, { text: ok ? 'TWO POINTS!' : 'TRY FAILS', sub: ok ? '+2' : 'Stopped short', kind: ok ? 'score' : 'miss' }, afterScoreNext(g, side));
  }

  const desc = pd.name ? `${pd.name}: ` : '';
  switch (r.kind) {
    case 'td': {
      if (r.scorer === 'D') {
        const ip = r.carrierPid && findP(g, other, r.carrierPid);
        if (ip) pstat(g, other, ip).pick++;
        pstat(g, side, qbP).int++; T.to++;
        logLine(g, `${desc}intercepted and returned for a touchdown by ${cname}!`);
        return scoreTD(g, other, { text: 'PICK SIX!', sub: `${cname} takes it back`, kind: 'td', turnover: true });
      }
      const cp = findP(g, side, r.carrierPid);
      if (cp) { if (r.caught) { pstat(g, side, cp).rectd++; pstat(g, side, qbP).ptd++; } else pstat(g, side, cp).rtd++; }
      logLine(g, `${desc}${cname} scores from ${Math.round(100 - g.ballOn)} yd out.`);
      const tdy = Math.round(100 - g.ballOn);
      return scoreTD(g, side, { text: 'TOUCHDOWN!', sub: cname ? `${cname}, ${tdy}-yd ${r.caught ? 'catch' : 'run'}` : `${tdy}-yd ${r.caught ? 'catch' : 'run'}`, kind: 'td', yards: tdy });
    }
    case 'safety': {
      addScore(g, other, 2);
      logLine(g, `${desc}tackled in the end zone. Safety.`);
      if (g.ot) return setResult(g, { text: 'SAFETY', sub: '+2', kind: 'score' }, 'otNext');
      setResult(g, { text: 'SAFETY!', sub: `+2 ${tdef(g, other).short}. Free kick from the 20`, kind: 'score' }, checkClockAfter(g, { freeKickBy: side }));
      return;
    }
    case 'int': case 'touchback': {
      const ip = r.carrierPid && findP(g, other, r.carrierPid);
      if (ip) pstat(g, other, ip).pick++;
      pstat(g, side, qbP).int++; T.to++;
      const spot = r.kind === 'touchback' ? 20 : clamp(Math.round(r.intSpot), 1, 99);
      logLine(g, `${desc}INTERCEPTED by ${cname}${r.kind === 'touchback' ? ' in the end zone (touchback)' : ''}.`);
      if (g.ot) return setResult(g, { text: 'INTERCEPTED', sub: `${cname}`, kind: 'turnover' }, 'otNext');
      changePossession(g, other, spot);
      return setResult(g, { text: 'INTERCEPTED!', sub: `${cname}: ${tdef(g, other).short} ball on the ${yardLine(spot)}`, kind: 'turnover' }, checkClockAfter(g));
    }
    case 'fumbleLost': {
      T.to++;
      const spot = clamp(100 - (g.ballOn + gain), 1, 99);
      logLine(g, `${desc}${cname} fumbles; ${tdef(g, other).short} recovers.`);
      if (g.ot) return setResult(g, { text: 'FUMBLE!', sub: 'Recovered by the defense', kind: 'turnover' }, 'otNext');
      changePossession(g, other, spot);
      return setResult(g, { text: 'FUMBLE!', sub: `${tdef(g, other).short} recovers on the ${yardLine(spot)}`, kind: 'turnover' }, checkClockAfter(g));
    }
  }

  // Ordinary downs: tackles, sacks, out of bounds, incompletions, throwaways, kneels.
  const before = g.ballOn;
  g.ballOn = clamp(before + gain, 1, 99);
  let text, sub;
  const inc = r.kind === 'inc' || r.kind === 'throwaway';
  if (r.kneel) { text = 'KNEEL'; sub = 'Clock keeps running'; logLine(g, 'QB takes a knee.'); }
  else if (inc) {
    text = r.kind === 'throwaway' ? 'THROWN AWAY' : r.why === 'breakup' ? 'BROKEN UP' : r.why === 'drop' ? 'DROPPED' : 'INCOMPLETE';
    sub = 'Clock stops';
    logLine(g, `${desc}pass incomplete${r.why === 'breakup' ? ', broken up' : r.why === 'drop' ? ', dropped' : ''}.`);
  } else if (r.kind === 'sack') {
    text = `SACKED ${gain} YD`; sub = `${nameOf(g, other, r.tacklerPid)} gets home`;
    logLine(g, `${desc}QB sacked for ${-gain} yd by ${nameOf(g, other, r.tacklerPid)}.`);
  } else {
    text = gain > 0 ? `+${gain} YD` : gain === 0 ? 'NO GAIN' : `LOSS OF ${-gain}`;
    sub = `${cname ? cname + (r.caught ? ' catch' : ' run') : r.caught ? 'Catch' : 'Run'}${r.kind === 'oob' ? ', out of bounds' : ''}`;
    logLine(g, `${desc}${cname} ${r.caught ? 'catches it for' : 'runs for'} ${gain} yd${r.kind === 'oob' ? ' (out of bounds)' : ''}.`);
  }
  let firstDown = false, turnover = false;
  if (gain >= g.toGo) {
    firstDown = true; g.down = 1; g.toGo = Math.min(10, 100 - g.ballOn); T.fd++;
    text += ' · FIRST DOWN';
  } else {
    g.down++; g.toGo -= gain;
    if (g.down > 4) {
      turnover = true;
      logLine(g, 'Turnover on downs.');
      if (g.ot) return setResult(g, { text: 'STOPPED!', sub: 'Turnover on downs', kind: 'turnover' }, 'otNext');
      changePossession(g, other, 100 - g.ballOn);
      text = 'TURNOVER ON DOWNS'; sub = `${tdef(g, other).short} takes over`;
    }
  }
  setResult(g, { text, sub, kind: turnover ? 'turnover' : firstDown ? 'first' : gain >= 15 ? 'big' : 'play', yards: gain, firstDown }, checkClockAfter(g));
}

// What happens after a result toast: decides quarter ends using the clock and the pending runoff.
function checkClockAfter(g, after = {}) {
  g.afterScore = after;
  if (g.ot) return 'call';
  if (g.clock <= 0) return 'endQuarter';
  if (after.kickoffBy !== undefined) return 'kickoff';
  if (after.freeKickBy !== undefined) return 'freeKick';
  return 'call';
}

function useTimeout(g, side) {
  if (g.ot || g.timeouts[side] <= 0 || !['call', 'result'].includes(g.phase) || g.runoff <= 0) return false;
  g.timeouts[side]--; g.runoff = 0;
  logLine(g, `Timeout, ${tdef(g, side).short} (${g.timeouts[side]} left).`);
  return true;
}

// Move on from a result, a quarter break or halftime.
function advance(g, rng) {
  if (g.phase === 'result') {
    const n = g.next; g.next = null;
    const aft = g.afterScore || {};
    g.afterScore = null;
    switch (n) {
      case 'pat': g.phase = 'pat'; return;
      case 'kickoff': startKickoff(g, aft.kickoffBy, rng); return;
      case 'freeKick': startKickoff(g, aft.freeKickBy, rng, 20, true); return;
      case 'endQuarter': g.pendingAfter = aft; endOfQuarter(g, rng); return;
      case 'otNext': otNext(g, rng); return;
      case 'final': g.phase = 'final'; return;
      default:
        g.phase = 'call';
        if (g.runoff > 0) for (const s of [0, 1]) if (s !== g.user && AI.wantsTimeout(g, s)) { useTimeout(g, s); break; }
        return;
    }
  }
  if (g.phase === 'break') {
    const q = g.quarter;
    if (q === 3) {
      g.timeouts = [3, 3];
      const aft = g.pendingAfter || {};
      g.pendingAfter = null;
      startKickoff(g, g.openingReceiver, rng);
      void aft;
    } else {
      g.phase = 'call';
      const aft = g.pendingAfter || {};
      g.pendingAfter = null;
      if (aft.kickoffBy !== undefined) startKickoff(g, aft.kickoffBy, rng);
      else if (aft.freeKickBy !== undefined) startKickoff(g, aft.freeKickBy, rng, 20, true);
    }
    return;
  }
  if (g.phase === 'otStart') { otBegin(g, rng); }
}

function endOfQuarter(g, rng) {
  g.runoff = 0;
  const q = g.quarter;
  if (q < 4) {
    g.quarter = q + 1; g.clock = g.quarterMin * 60;
    g.phase = 'break';
    g.breakKind = q === 2 ? 'half' : 'quarter';
    logLine(g, q === 2 ? 'Halftime.' : `End of quarter ${q}.`);
    return;
  }
  if (g.score[0] !== g.score[1]) { g.phase = 'final'; g.over = true; logLine(g, 'Final.'); return; }
  g.phase = 'otStart';
  g.ot = { round: 0, first: null, turn: 0, startScore: null };
  g.quarter = 5; g.clock = 0;
  logLine(g, 'Tied after four quarters: overtime.');
}

// Overtime (game rule): each team gets one series from the opponent's 10.
function otBegin(g, rng) {
  const toss = rng.int(2);
  g.ot.first = 1 - toss; // the toss winner chooses to go second
  g.ot.round = 1; g.ot.turn = 0;
  otSeries(g, g.ot.first);
}

function otSeries(g, side) {
  g.poss = side; g.ballOn = 90; g.down = 1; g.toGo = 10; g.absX = W / 2; g.twoPoint = false;
  g.ot.startScore = [...g.score];
  g.phase = 'call';
  logLine(g, `Overtime round ${g.ot.round}: ${tdef(g, side).short} from the 10.`);
}

function otNext(g, rng) {
  const ot = g.ot;
  if (ot.turn === 0) { ot.turn = 1; otSeries(g, 1 - ot.first); return; }
  if (g.score[0] !== g.score[1]) { g.phase = 'final'; g.over = true; logLine(g, 'Final (overtime).'); return; }
  ot.round++; ot.turn = 0; g.quarter++;
  otSeries(g, ot.first);
}

// In OT, a series also ends without a turnover once its score is settled (TD + try, FG).
function otSeriesDone(g) { return !!g.ot && g.phase === 'result' && g.next === 'otNext'; }

// ---- Whole-game helpers ------------------------------------------------------------------------
// AI plays both sides to the end (used by tests, Node tools and "watch the rest").
function autoplay(g, rng, maxSteps = 5000) {
  let steps = 0, plays = 0, maxPlayT = 0;
  while (!g.over && g.phase !== 'final' && steps++ < maxSteps) {
    switch (g.phase) {
      case 'toss': coinToss(g, 'heads', rng); startKickoff(g, 1 - g.openingReceiver, rng); break;
      case 'kickoff': if (g.pendingPunt) finishPunt(g); else finishKickoff(g, rng); break;
      case 'call': {
        const o = AI.offenseCall(g, rng), d = AI.defenseCall(g, rng);
        callPlay(g, o, d, rng);
        break;
      }
      case 'pre': snapPlay(g); break;
      case 'live': finishLive(g, rng); plays++; if (g.play) maxPlayT = Math.max(maxPlayT, g.play.t); break;
      case 'result': advance(g, rng); break;
      case 'pat': chooseTry(g, AI.patChoice(g)); break;
      case 'kick': resolveKick(g, aiKickError(rng, g.kick.kck), rng); break;
      case 'kickfly': finishKick(g, rng); break;
      case 'break': case 'otStart': advance(g, rng); break;
      default: steps = maxSteps;

    <div class="team-grid">${REAL.map((t) => teamCard(t, x.team === t.id, 'pickSeason')).join('')}</div>
    <div class="opts">
      ${segRow('Length', 'seasonLen', [['full', 'Full (9 weeks)'], ['short', 'Short (5 weeks)']], x.short ? 'short' : 'full')}
      ${segRow('Quarters', 'set:quarterMin', [[4, '4 min'], [8, '8 min'], [12, '12 min']], S.settings.quarterMin)}
      ${segRow('Difficulty', 'set:difficulty', Object.entries(DIFFICULTY).map(([k, v]) => [k, v.label]), S.settings.difficulty)}
    </div>
    <div class="actions">${btn('startSeason', 'Start season ▶', { cls: 'primary', auto: true })}</div>
  </div>`;
}

function weekLabel(s, w) { return s.weeks.length === 9 ? `Week ${w + 1}` : `Week ${w + 1}`; }

function seasonHTML(S) {
  const s = S.season, me = teamDef(s.userTeam);
  const tab = S.ui.tab || 'schedule';
  const ug = L.userGame(s);
  let headline = '', actions = '';
  if (s.phase === 'regular' && ug) {
    const oppId = ug.home === s.userTeam ? ug.away : ug.home, opp = teamDef(oppId);
    headline = `${weekLabel(s, s.week)}${s.week === 0 ? ' (late August)' : ''}: ${ug.home === s.userTeam ? 'vs' : 'at'} ${esc(opp.short)} ${opp.mascot}${ug.rivalry ? ' <span class="tag rival">Rivalry Week</span>' : ''}`;
    actions = btn('playWeek', 'Play game ▶', { cls: 'primary', auto: true }) + btn('simWeek', 'Sim game');
  } else if (s.phase === 'playoffs' && ug) {
    const oppId = ug.home === s.userTeam ? ug.away : ug.home;
    headline = `${ug.final ? 'Spa City Cup final (neutral site)' : 'Semifinal'}: ${ug.final ? 'vs' : ug.home === s.userTeam ? 'vs' : 'at'} ${esc(teamDef(oppId).short)}`;
    actions = btn('playWeek', 'Play game ▶', { cls: 'primary', auto: true }) + btn('simWeek', 'Sim game');
  } else if (s.phase === 'playoffs') {
    headline = s.playoffs.round === 1 ? 'Playoff semifinals (you did not qualify)' : 'Spa City Cup final';
    actions = btn('simWeek', 'Sim to the end ▶', { cls: 'primary', auto: true });
  } else if (s.phase === 'done') {
    const ch = teamDef(s.champion);
    headline = `${s.year} Spa City Cup champion: ${esc(ch.short)} ${ch.mascot}`;
    actions = btn('nextSeason', `Play ${s.year + 1} season ▶`, { cls: 'primary', auto: true }) + btn('go', 'Title', { id: 'title' });
  }
  const tabs = [['schedule', 'Schedule'], ['standings', 'Standings'], ['roster', 'Roster']];
  let body = '';
  if (tab === 'schedule') body = scheduleHTML(s);
  else if (tab === 'standings') body = standingsHTML(s);
  else body = rosterHTML(s.rosters[s.userTeam], me);
  const recap = S.ui.weekRecap ? `<div class="recap" role="status">${S.ui.weekRecap}</div>` : '';
  return `<div class="panel-screen season">${btn('go', '← Title', { id: 'title', cls: 'ghost back' })}
    <div class="season-head">${mascot(me.id, 64)}<div><h2>${esc(me.short)} ${me.mascot} · ${s.year}</h2>
      <p class="sub">Record ${L.userRecord(s)}${s.phase === 'playoffs' ? ' · Playoffs' : ''}</p></div></div>
    ${recap}
    <p class="headline">${headline}</p>
    <div class="actions">${actions}</div>
    <div class="seg tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-act="tab" data-id="${k}">${l}</button>`).join('')}</div>
    <div class="tab-body">${body}</div>
  </div>`;
}

function scheduleHTML(s) {
  const rows = s.weeks.map((wk, w) => {
    const g = wk.find((x) => x.home === s.userTeam || x.away === s.userTeam);
    const home = g.home === s.userTeam, opp = teamDef(home ? g.away : g.home);
    let res = '—';
    if (g.result) {
      const my = home ? g.result.hs : g.result.as, th = home ? g.result.as : g.result.hs;
      res = `<b class="${my > th ? 'w' : 'l'}">${my > th ? 'W' : 'L'}</b> ${my}–${th}${g.result.ot ? ' (OT)' : ''}${g.result.simmed ? ' <span class="small">sim</span>' : ''}`;
    }
    const cur = s.phase === 'regular' && w === s.week;
    return `<tr class="${cur ? 'cur' : ''}"><td>${w + 1}</td><td>${home ? 'vs' : 'at'} ${mascot(opp.id, 22, 'inline')} ${esc(opp.short)}${g.rivalry ? ' <span class="tag rival">Rivalry</span>' : ''}${opp.fictional ? ' <span class="tag">fictional</span>' : ''}</td><td>${res}</td></tr>`;
  }).join('');
  let po = '';
  if (s.playoffs) {
    const P = s.playoffs;
    const gl = (g) => `${esc(teamDef(g.home).short)} ${g.result ? `${g.result.hs}–${g.result.as} ` : 'vs '}${esc(teamDef(g.away).short)}`;
    po = `<h3>Playoffs</h3><ul class="bracket"><li>Semifinal: ${gl(P.semis[0])}</li><li>Semifinal: ${gl(P.semis[1])}</li>${P.final ? `<li><b>Spa City Cup final</b> (a neutral site): ${gl(P.final)}</li>` : ''}</ul>`;
  }
  const Ld = Object.values(s.leaders || {});
  const top = (k, lbl) => { const p = Ld.slice().sort((a, b) => b[k] - a[k])[0]; return p && p[k] > 0 ? `<li>${lbl}: ${esc(p.name)} (${p.pos}), ${p[k]}${k === 'tkl' ? ' tackles' : k === 'td' ? ' TD' : ' yd'}</li>` : ''; };
  const lead = Ld.length ? `<h3>Season leaders <span class="small">(games you played)</span></h3><ul class="leaders">${top('py', 'Passing')}${top('ry', 'Rushing')}${top('recy', 'Receiving')}${top('td', 'Touchdowns')}${top('tkl', 'Tackles')}</ul>` : '';
  return `<table class="tbl"><thead><tr><th>Wk</th><th>Opponent</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>${po}${lead}`;
}

function standingsHTML(s) {
  const rows = L.standings(s).map((r, i) => {
    const t = teamDef(r.id);
    return `<tr class="${r.id === s.userTeam ? 'cur' : ''}"><td>${i + 1}</td><td>${mascot(t.id, 22, 'inline')} ${esc(t.short)}${t.fictional ? ' <span class="tag">fictional</span>' : ''}</td><td>${r.w}-${r.l}</td><td>${r.pf}</td><td>${r.pa}</td></tr>`;
  }).join('');
  return `<table class="tbl"><thead><tr><th>#</th><th>Team</th><th>W-L</th><th>PF</th><th>PA</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="small">Top four make the playoffs. Ties: head-to-head, then point differential, then points scored.</p>`;
}

const KEY_R = { QB: ['thr', 'acc', 'awr'], RB: ['spd', 'agi', 'str'], WR: ['spd', 'hnd', 'agi'], TE: ['hnd', 'blk', 'str'], OL: ['blk', 'str', 'awr'], DL: ['str', 'tkl', 'agi'], LB: ['tkl', 'spd', 'cov'], CB: ['cov', 'spd', 'agi'], S: ['cov', 'tkl', 'spd'], K: ['kck'] };
const R_NAME = { spd: 'SPD', str: 'STR', agi: 'AGI', hnd: 'HND', thr: 'ARM', acc: 'ACC', tkl: 'TKL', cov: 'COV', blk: 'BLK', awr: 'AWR', kck: 'KICK' };
function rosterHTML(players, team) {
  const d = depth(players), c = composite(players);
  const groups = Object.keys(POSITIONS).map((pos) => `<tr class="grp"><th colspan="5">${pos}</th></tr>` + d[pos].map((p, i) =>
    `<tr${i < startersCount(pos) ? ' class="st"' : ''}><td>#${p.num}</td><td>${esc(p.first)} ${esc(p.last)}</td><td>${p.yr}</td><td><b>${p.ovr}</b></td><td class="small">${KEY_R[pos].map((k) => `${R_NAME[k]} ${p.r[k]}`).join(' · ')}</td></tr>`).join('')).join('');
  return `<p class="note">All players are fictional. Team ratings: offense ${c.off}, defense ${c.def}. Starters are highlighted.</p>
    <table class="tbl roster"><thead><tr><th>No.</th><th>Name</th><th>Yr</th><th>OVR</th><th>Key ratings</th></tr></thead><tbody>${groups}</tbody></table>`;
}
const startersCount = (pos) => ({ QB: 1, RB: 1, WR: 3, TE: 1, OL: 5, DL: 4, LB: 3, CB: 2, S: 2, K: 1 }[pos]);

const CHALLENGES = [
  { id: 'twoMinute', name: 'Two-Minute Drill', desc: 'Down 21–17 with 2:00 left in the fourth. Your ball at your own 30 with 2 timeouts. Score a touchdown to win.' },
  { id: 'goalLine', name: 'Goal-Line Stand', desc: 'Up 24–21 with 1:10 left. The opponent has 1st and goal at your 8. Keep them out of the end zone and win the game.' },
  { id: 'rivalry', name: 'Rivalry Renewed', desc: 'Lakeside vs Lake Hamilton at Wolf Stadium in Pearcy. Pick a side and win a full game. (A game scenario, not a recreation.)' },
];

function challengesHTML(S) {
  const cards = CHALLENGES.map((c) => `<div class="ch-card"><h3>${c.name} ${S.challenges[c.id] ? '<span class="tag done">✓ Completed</span>' : ''}</h3><p>${c.desc}</p>
    ${c.id === 'rivalry'
      ? `<div class="actions">${btn('challenge', `Play as Lakeside ${mascot('lakeside', 22, 'inline')}`, { id: 'rivalry:lakeside' })}${btn('challenge', `Play as Lake Hamilton ${mascot('lake-hamilton', 22, 'inline')}`, { id: 'rivalry:lake-hamilton' })}</div>`
      : `<div class="actions">${btn('challenge', 'Play ▶', { id: c.id, cls: 'primary' })}</div>`}</div>`).join('');
  return `<div class="panel-screen">${back()}<h2>Challenges</h2>
    <p class="note">Challenges 1 and 2 use your team from Exhibition (${esc(teamDef(S.exhib.you).short)}) against ${esc(teamDef(S.exhib.opp).short)}.</p>${cards}</div>`;
}

function helpHTML(S) {
  const tab = S.ui.helpTab || 'basics';
  const tabs = [['basics', 'Basics'], ['controls', 'Controls'], ['rules', 'Rules'], ['credits', 'Credits']];
  let body = '';
  if (tab === 'basics') body = `
    <p><b>Football in one minute.</b> Your offense has four tries (<b>downs</b>) to move the ball 10 yards. Make it and you get a fresh set (<b>first down</b>). Score a <b>touchdown</b> (6 points) by carrying or catching the ball in the end zone at the top of the screen. After a touchdown, kick the try (1 point) or run one play from the 3 for 2 points. Out of downs? On 4th down you can <b>punt</b> it away or try a <b>field goal</b> (3 points).</p>
    <p><b>Each snap:</b> call a play from the cards, see the routes, then press <b>HIKE</b>. On runs, the carrier runs on his own; steer to find a hole and <b>JUKE</b> to slip a tackle. On passes, tap a receiver (or press his number) when he's open; the auto-QB throws for you if you wait. On defense, pick a call and watch it play out.</p>
    <p><b>Reading the field:</b> your team is always the circles moving up the screen; the opponent is squares. The <span class="k-blue">blue line</span> is the line of scrimmage and the <span class="k-gold">gold line</span> is the first-down marker. Receivers wear shape badges: ${BADGES.map((b, i) => `${b} ${i + 1}`).join(', ')}.</p>
    <p><b>Calls that beat calls:</b> Runs beat <i>Deep Shell</i>; deep passes beat <i>Run Stuff</i>; quick slants and screens beat <i>Fire Blitz</i>; a QB keeper beats <i>Man Press</i>. Each defensive card says what it's strong against.</p>`;
  else if (tab === 'controls') body = `<table class="tbl keys"><tbody>
    <tr><th>Choose a play</th><td>Number keys (1–9, 0), or tap a card. Specials: P punt, F field goal, K kneel</td></tr>
    <tr><th>Snap</th><td>Space, or HIKE. Backspace changes the play</td></tr>
    <tr><th>Throw</th><td>1–5 (${BADGES.join(' ')}), or tap the receiver or his badge button</td></tr>
    <tr><th>Steer the runner</th><td>Arrow keys or WASD, or drag on the field</td></tr>
    <tr><th>Juke</th><td>J or Shift, or JUKE</td></tr>
    <tr><th>Kick</th><td>Space or tap to stop the needle in the green</td></tr>
    <tr><th>Timeout</th><td>T (between plays, while the clock is running)</td></tr>
    <tr><th>Continue</th><td>Space or Enter</td></tr>
    <tr><th>Pause</th><td>Esc or P · Mute: M</td></tr></tbody></table>
    <p>Assists in Settings: Auto-QB throws on a read if you don't, Auto-kick replaces the needle, and Play speed runs plays faster.</p>`;
  else if (tab === 'rules') body = `<p>These are the <b>game's rules</b>. They follow general high-school football, but they are not a statement of Arkansas Activities Association rules, which this game doesn't claim to model.</p>
    <ul><li>11 players a side, four quarters of 4, 8 or 12 minutes (Settings).</li>
    <li>The clock runs during plays plus a 25-second runoff between plays, and stops after incompletions, out of bounds, scores, changes of possession and timeouts. Three timeouts per team per half.</li>
    <li>Kickoffs from the 40; a kick into the end zone is a touchback to the 20. After a safety, the scored-on team free-kicks from its 20.</li>
    <li>Scoring: touchdown 6, try 1 (kick) or 2 (play from the 3), field goal 3, safety 2.</li>
    <li>After a play ends outside the hash marks, the ball is spotted on the nearer hash.</li>
    <li><b>Overtime:</b> each team gets one series from the opponent's 10. The coin-toss winner goes second. Repeat until one team leads after both have had a series.</li>
    <li>No penalties, injuries or onside kicks. The field doesn't switch ends between quarters.</li></ul>`;
  else body = `<p><b>Friday Night Spa City</b> is an original game in the open-source Hot Springs Games collection (MIT).</p>
    <ul><li><b>Schools:</b> the seven Garland County high schools (names, cities, mascots, classifications, state title years, rivalries) come from the collection's shared research file (<i>shared/data/schools.json</i>, sourced to Wikipedia, the AAA-related press and the Hot Springs Sentinel-Record). Real schools are setting only. Nothing implies endorsement by any school.</li>
    <li><b>Colors:</b> hex values are stand-ins. For Fountain Lake, Cutter-Morning Star, Jessieville and Mountain Pine even the color choices are <b>game colors</b>, not confirmed school colors.</li>
    <li><b>Mascot art</b> is original geometric art drawn in code, not any school's logo.</li>
    <li><b>Players are fictional.</b> Every name is generated; no real students or coaches appear.</li>
    <li><b>Invented:</b> the Spa City Cup league, its playoff and trophy, Rivalry Week, all play names, and the towns of Quartz Hollow, Tufa Ridge and Cinnabar Flats.</li>
    <li><b>Venues</b> are named only where confirmed (Joe C. Reese Stadium; Wolf Stadium in Pearcy); others are shown as a school's home field.</li>
    <li><b>Halftime facts</b> come from the collection's audited trivia bank, each with its source.</li>
    <li>Art is procedural canvas drawing; sound is WebAudio synthesis. No network requests.</li></ul>`;
  return `<div class="panel-screen">${S.helpFromGame ? btn('closeOverlay', '← Back to game', { cls: 'ghost back' }) : back()}<h2>How to Play</h2>
    <div class="seg tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? 'on' : ''}" data-act="helpTab" data-id="${k}">${l}</button>`).join('')}</div>
    <div class="tab-body prose">${body}</div></div>`;
}

function settingsHTML(S) {
  const s = S.settings;
  const tog = (k, label) => `<label class="tog"><input type="checkbox" data-set="${k}" ${s[k] ? 'checked' : ''}> <span>${label}</span></label>`;
  return `<div class="panel-screen">${S.helpFromGame ? btn('closeOverlay', '← Back to game', { cls: 'ghost back' }) : back()}<h2>Settings</h2>
    ${S.saveOk ? '' : '<p class="warn" role="status">Saving unavailable: this browser is blocking storage, so progress lasts only until you close the page.</p>'}
    <div class="opts">
      ${tog('sound', 'Sound (M)')}
      <label class="range"><span id="lbl-vol">Volume</span> <input type="range" min="0" max="100" step="5" value="${Math.round(s.volume * 100)}" data-set="volume" aria-labelledby="lbl-vol"></label>
      ${segRow('Motion', 'set:motion', [['auto', 'System'], ['full', 'Full'], ['reduced', 'Reduced']], s.motion)}
      ${segRow('Theme', 'set:theme', [['night', 'Night game'], ['day', 'Day game']], s.theme)}
      ${segRow('Text size', 'set:textScale', [[1, '100%'], [1.15, '115%'], [1.3, '130%']], s.textScale)}

      ${tog('autoQB', 'Auto-QB: throw on a read if I wait')}
      ${tog('autoKick', 'Auto-kick (no needle)')}
      ${tog('autoContinue', 'Auto-continue after each play')}
      ${tog('routes', 'Show route previews')}
    </div></div>`;
}

function pregameHTML(S) {
  const g = S.game, A = teamDef(g.teams[0].id), B = teamDef(g.teams[1].id);
  const home = teamDef(g.teams[g.home].id);
  const venue = g.neutral ? 'a neutral site' : home.venue;
  const riv = rivalryText(A.id, B.id);
  const toss = g.toss;
  const tossHTML = !toss ? `<p class="headline">Coin toss: call it.</p><div class="actions">${btn('coin', 'Heads', { id: 'heads', cls: 'primary', auto: true })}${btn('coin', 'Tails', { id: 'tails' })}</div>`
    : `<p class="headline" role="status">It's ${toss.flip}. ${esc(teamDef(g.teams[toss.winner].id).short)} will receive.</p><div class="actions">${btn('kickoff', 'Kick off ▶', { cls: 'primary', auto: true })}</div>`;
  const label = g.challenge ? CHALLENGES.find((c) => c.id === g.challenge.id).name : g.mode === 'season' ? (g.final ? 'Spa City Cup final' : g.semi ? 'Playoff semifinal' : `Week ${g.seasonWeek + 1}`) : 'Exhibition';
  return `<div class="pregame">
    <canvas id="splash" aria-hidden="true"></canvas>
    <div class="pg-card">
      <p class="eyebrow">${esc(label)}${g.rivalry ? ' · <span class="tag rival">Rivalry Week</span>' : ''}</p>
      <div class="matchup">
        <div class="mt">${mascot(A.id, 88)}<b>${esc(A.short)}</b><span>${A.mascot}${g.home === 0 && !g.neutral ? ' · home' : ''}</span></div>
        <div class="vs">vs</div>
        <div class="mt">${mascot(B.id, 88)}<b>${esc(B.short)}</b><span>${B.mascot}${g.home === 1 && !g.neutral ? ' · home' : ''}</span></div>
      </div>
      <p class="venue">at ${esc(venue)}</p>
      ${riv ? `<p class="fact">${esc(riv)}</p>` : ''}
      ${tossHTML}
    </div></div>`;
}

function finalHTML(S) {
  const g = S.game, A = teamDef(g.teams[0].id), B = teamDef(g.teams[1].id);
  const won = g.score[0] > g.score[1];
  const ot = g.qScores[0].length > 4 || g.quarter > 4;
  const qrow = (i, t) => `<tr><th>${mascot(t.id, 22, 'inline')} ${t.abbr}</th>${[0, 1, 2, 3].map((q) => `<td>${g.qScores[i][q]}</td>`).join('')}${ot ? `<td>${g.qScores[i][4] || 0}</td>` : ''}<td><b>${g.score[i]}</b></td></tr>`;
  const T = g.stats.team;
  const sr = (l, a, b) => `<tr><th>${l}</th><td>${a}</td><td>${b}</td></tr>`;
  const pog = playerOfGame(g);
  const leaders = (side) => {
    const list = Object.values(g.stats.players).filter((p) => p.side === side);
    const top = (k) => list.sort((a, b) => b[k] - a[k])[0];
    const out = [];
    const qb = top('py'); if (qb && qb.att) out.push(`Passing: ${esc(qb.name)}, ${qb.cmp}/${qb.att} ${qb.py} yd`);
    const rb = top('ry'); if (rb && rb.ru) out.push(`Rushing: ${esc(rb.name)}, ${rb.ru} for ${rb.ry} yd`);
    const wr = top('recy'); if (wr && wr.rec) out.push(`Receiving: ${esc(wr.name)}, ${wr.rec} for ${wr.recy} yd`);
    const lb = top('tkl'); if (lb && lb.tkl) out.push(`Tackles: ${esc(lb.name)}, ${lb.tkl}`);
    return out.map((x) => `<li>${x}</li>`).join('');
  };
  let headline = won ? `${esc(A.short)} wins!` : `${esc(B.short)} wins.`;
  let chal = '';
  if (g.challenge) chal = `<p class="headline ${won ? 'w' : 'l'}" role="status">${won ? 'Challenge complete ✓' : 'Challenge failed. Try again?'}</p>`;
  const acts = g.mode === 'season' ? btn('seasonContinue', 'Continue ▶', { cls: 'primary', auto: true })
    : g.challenge ? btn('challenge', 'Retry', { id: g.challenge.key || g.challenge.id, cls: 'primary', auto: true }) + btn('go', 'Challenges', { id: 'challenges' })
      : btn('rematch', 'Rematch', { cls: 'primary', auto: true }) + btn('go', 'Title', { id: 'title' });
  return `<div class="panel-screen final">
    <p class="eyebrow">Final${ot ? ' (overtime)' : ''}</p>
    <h2 class="${won ? 'w' : 'l'}">${headline}</h2>${chal}
    <table class="tbl qs"><thead><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th>${ot ? '<th>OT</th>' : ''}<th>T</th></tr></thead><tbody>${qrow(0, A)}${qrow(1, B)}</tbody></table>
    ${pog ? `<div class="pog"><span class="eyebrow">Player of the Game</span><b>${esc(pog.name)}</b> #${pog.num} ${pog.pos}, ${esc(teamDef(g.teams[pog.side].id).short)}<br><span class="small">${statLine(pog)}</span></div>` : ''}
    <div class="cols">
      <table class="tbl"><thead><tr><th>Team stats</th><th>${A.abbr}</th><th>${B.abbr}</th></tr></thead><tbody>
      ${sr('First downs', T[0].fd, T[1].fd)}${sr('Total yards', T[0].yds, T[1].yds)}${sr('Passing', T[0].py, T[1].py)}${sr('Rushing', T[0].ry, T[1].ry)}${sr('Turnovers', T[0].to, T[1].to)}${sr('Plays', T[0].plays, T[1].plays)}</tbody></table>
      <div><h3>${esc(A.short)}</h3><ul class="leaders">${leaders(0)}</ul><h3>${esc(B.short)}</h3><ul class="leaders">${leaders(1)}</ul></div>
    </div>
    <p class="small">All players are fictional.</p>
    <div class="actions">${acts}</div></div>`;
}

function championHTML(S) {
  const s = S.season, ch = teamDef(s.champion);
  return `<div class="champion"><canvas id="cup" aria-hidden="true"></canvas>
